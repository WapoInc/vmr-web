<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#0f1419"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#4FC3F7" font-size="24" font-weight="bold">Azure Network Infrastructure</text>
  
  <!-- Central Hub -->
  <circle cx="400" cy="300" r="60" fill="#1a2332" stroke="#4FC3F7" stroke-width="3"/>
  <text x="400" y="305" text-anchor="middle" fill="#4FC3F7" font-size="16" font-weight="bold">CORE</text>
  
  <!-- Outer Nodes -->
  <!-- Top Node -->
  <circle cx="400" cy="150" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 1</text>
  <line x1="400" y1="240" x2="400" y2="190" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Top Right Node -->
  <circle cx="570" cy="200" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="570" y="205" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 2</text>
  <line x1="450" y1="270" x2="540" y2="225" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Right Node -->
  <circle cx="630" cy="300" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="630" y="305" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 3</text>
  <line x1="460" y1="300" x2="590" y2="300" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Bottom Right Node -->
  <circle cx="570" cy="400" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="570" y="405" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 4</text>
  <line x1="450" y1="330" x2="540" y2="375" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Bottom Node -->
  <circle cx="400" cy="450" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="400" y="455" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 5</text>
  <line x1="400" y1="360" x2="400" y2="410" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Bottom Left Node -->
  <circle cx="230" cy="400" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="230" y="405" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 6</text>
  <line x1="350" y1="330" x2="260" y2="375" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Left Node -->
  <circle cx="170" cy="300" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="170" y="305" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 7</text>
  <line x1="340" y1="300" x2="210" y2="300" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Top Left Node -->
  <circle cx="230" cy="200" r="40" fill="#2a3342" stroke="#4FC3F7" stroke-width="2"/>
  <text x="230" y="205" text-anchor="middle" fill="#4FC3F7" font-size="12">Region 8</text>
  <line x1="350" y1="270" x2="260" y2="225" stroke="#4FC3F7" stroke-width="2"/>
  
  <!-- Data flow indicators -->
  <circle cx="400" cy="170" r="5" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="555" cy="212" r="5" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="610" cy="300" r="5" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Footer -->
  <text x="400" y="560" text-anchor="middle" fill="#4FC3F7" font-size="18">Global Azure Network</text>
</svg>
