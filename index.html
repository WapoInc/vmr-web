<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
  <style>
    body {
      margin:0;
      font-family: system-ui, sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      background:#0f1419;
      color:#fff;
      padding:1rem;
    }
    h1 {
      font-size:3rem;
      font-family: "Comic Sans MS", cursive;
      margin:0 0 1.5rem;
      text-align:center;
      letter-spacing:.05em;
      color: white;
    }
    .additional-text {
      font-size: 3rem;
      font-style: italic;
    }
    .datacenter {
      width:160px;
      max-width:40vw;
      aspect-ratio:16/9;
    }
    svg {
      width:100%;
      height:100%;
      display:block;
    }
    .repo-link {
      margin-top:1.25rem;
      font-size:3rem;
      font-style:italic;
      text-align:center;
    }
    .repo-link a {
      color:#4FC3F7;
      text-decoration:none;
    }
    .repo-link a:hover,
    .repo-link a:focus {
      text-decoration:underline;
    }
    .datacenter-image {
      max-width: 80%;
      height: auto;
      border-radius: 8px;
      margin: 2rem 0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <h1>Hello World<br><span class="additional-text">....... have a lekker day bru .......</span></h1>

  <img src="cloud-data-center.jpg" alt="Azure cloud computing data center" class="datacenter-image">

  <div class="repo-link">
    <a href="https://github.com/WapoInc/vmr-web" target="_blank" rel="noopener noreferrer">WapoInc/vmr-web</a>
  </div>
</body>
</html>
