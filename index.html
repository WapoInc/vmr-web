<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hello World</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Simple Hello World page" />
  <style>
    :root {
      color-scheme: light dark;
      --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg: #f7f9fa;
      --fg: #222;
      --accent: #2563eb;
      --card-bg: #ffffff;
      --shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --fg: #e6e6e6;
        --card-bg: #1e262f;
        --shadow: 0 4px 12px rgba(0,0,0,.55);
      }
    }
    body {
      margin: 0;
      font-family: var(--font-stack);
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main {
      padding: 2.5rem 3rem;
      background: var(--card-bg);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 480px;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 2.75rem);
      line-height: 1.1;
    }
    p {
      margin: 0 0 1.25rem;
      font-size: 1.05rem;
    }
    .accent {
      color: var(--accent);
      font-weight: 600;
    }
    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, <span class="accent">World!</span></h1>
    <p>This is a minimal HTML page. Edit <code>index.html</code> to customize.</p>
    <button type="button" id="helloBtn" aria-label="Show greeting in console">
      Click me
    </button>
    <footer>
      Served with ♥
    </footer>
  </main>
  <script>
    document.getElementById('helloBtn').addEventListener('click', () => {
      console.log('Hello World from JavaScript!');
      alert('Hello World!');
    });
  </script>
</body>
</html>
